# Поддержка указательных устройств (трекбол) в ZMK
CONFIG_ZMK_POINTING=y
CONFIG_SPI=y

# Для отладки можно временно раскомментировать (логи по USB):
# CONFIG_ZMK_USB_LOGGING=y

# Bluetooth: убираем задержку курсора.
# По умолчанию ZMK разрешает контроллеру «пропускать» до 30 соединений подряд
# (экономия батареи), из-за этого трекбол запаздывает при начале движения.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0

# ДИАГНОСТИКА (временно): логи по USB
CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_LOG_LEVEL_DBG=y
